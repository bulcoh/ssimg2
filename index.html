<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSimage 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; }

        body { font-family: 'Inter', sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; }

        .editor { width: 100%; max-width: 500px; background: #222; padding: 20px; border-radius: 20px; box-sizing: border-box; }
        h2 { font-family: 'Archivo Black', sans-serif; text-align: center; color: #ff4757; font-size: 24px; margin-top: 0; }

        textarea {
            width: 100%; height: 100px; background: #333; border: 1px solid #444; color: #fff;
            padding: 10px; border-radius: 10px; margin-bottom: 10px; resize: none; outline: none; box-sizing: border-box;
            -webkit-user-select: text; font-size: 16px; user-select: none;
        }

        .btn { background: #ff4757; color: white; padding: 18px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; margin-bottom: 10px; -webkit-appearance: none; box-sizing: border-box; appearance: none; }
        .btn-sub { background: #444; font-size: 16px; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-group .btn { flex: 1; font-size: 14px; padding: 12px; margin-bottom: 0; }
        .btn-swim { background: #1e90ff; }
        .btn-run { background: #2ed573; }

        .btn-done { background: #222 !important; color: #666 !important; border: 1px solid #444; opacity: 0.7; pointer-events: none; }
        .btn-data { background: #2f3542; color: #ced4da; margin-top: 5px; display: none; }

        /* 사진 선택/촬영 버튼 나란히 */
        .photo-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .photo-group label { flex: 1; margin-bottom: 0 !important; }

        /* --- 타입 선택 UI (3종) --- */
        .type-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .type-btn {
            flex: 1;
            box-sizing: border-box;
            padding: 12px 0;
            border-radius: 12px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #888;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            -webkit-appearance: none; appearance: none;
        }
        .type-btn.active-A { border-color: #ff4757; color: #ff4757; background: rgba(255,71,87,0.12); }
        .type-btn.active-B { border-color: #00d2ff; color: #00d2ff; background: rgba(0,210,255,0.10); }
        .type-btn.active-C { border-color: #ff9f43; color: #ff9f43; background: rgba(255,159,67,0.10); }

        .type-label { font-size: 10px; display: block; margin-top: 2px; opacity: 0.8; }

        #resultContainer { width: 100%; max-width: 500px; display: none; margin-top: 20px; text-align: center; }
        #resultImage { width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); -webkit-touch-callout: default !important; pointer-events: auto; }
        canvas { display: none; }
        .guide { color: #888; font-size: 13px; margin-top: 15px; line-height: 1.5; }
    </style>
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/exifreader/dist/exif-reader.min.js"></script>

</head>
<body>

<div class="editor">
    <h2>SSimage 2</h2>
    <textarea id="logInput" placeholder="Strong 로그를 복사해 넣으세요..."></textarea>

    <div class="btn-group">
        <button class="btn btn-swim" onclick="recordManual('swim')">🏊‍♂️ 수영 추가</button>
        <button class="btn btn-run" onclick="recordManual('run')">🏃‍♂️ 달리기 추가</button>
        <button class="btn btn-sub" onclick="loadTestData()" style="background:#333;color:#888;">🧪 테스트 모드</button>
    </div>

    <button class="btn btn-sub" onclick="pasteLog()">📋 클립보드 붙여넣기</button>

    <!-- 사진: 갤러리 선택 / 카메라 촬영 -->
    <input type="file" id="imageInput" accept="image/*" style="display:none">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <div class="photo-group">
        <label for="imageInput" class="btn btn-sub" id="fileLabel" style="display:block; text-align:center;">
            🖼️ 사진 선택하기
        </label>
        <label for="cameraInput" class="btn btn-sub" id="cameraLabel" style="display:block; text-align:center;">
            📷 사진 찍기
        </label>
    </div>

    <!-- 디자인 타입 선택 (3종) -->
    <div class="type-selector">
        <button class="type-btn active-A" id="typeA" onclick="selectType('A')">
            TYPE A
            <span class="type-label">Default</span>
        </button>
        <button class="type-btn" id="typeB" onclick="selectType('B')">
            TYPE B
            <span class="type-label">Graph</span>
        </button>
        <button class="type-btn" id="typeC" onclick="selectType('C')">
            TYPE C
            <span class="type-label">Fleek</span>
        </button>
    </div>

    <button class="btn" onclick="processWorkout()">이미지 생성 (딸깍!)</button>
</div>

<div id="resultContainer">
    <img id="resultImage" alt="Result Workout Image">
    <button id="pushGithubBtn" class="btn btn-data" style="display:block; background: #6c5ce7; color: white;">🚀 깃허브로 데이터 쏘기</button>
    <button id="saveDataBtn" class="btn btn-data" onclick="downloadData()">📊 파일로 저장 (비상용)</button>
    <div class="guide" onclick="resetToken()" style="cursor:pointer">SHARE STRONG IMAGE V2</div>
</div>

<canvas id="canvas"></canvas>

<script>
    let GITHUB_TOKEN = localStorage.getItem('gh_token') || "";
    const GITHUB_REPO = "bulcoh/ssimg2";
    const GITHUB_FILE_PATH = "data.json";

    let currentMinutes = 0;
    let currentFileDate = "";
    let selectedType = 'A';
    let currentParsed = null;

    function selectType(type) {
        selectedType = type;
        ['A','B','C'].forEach(function(t) {
            const btn = document.getElementById('type' + t);
            btn.className = 'type-btn';
            if (t === type) btn.classList.add('active-' + t);
        });
    }

    function checkToken() {
        if (!GITHUB_TOKEN) {
            const input = prompt("🔐 깃허브 토큰이 없습니다.\n처음 한 번만 입력해주세요. (브라우저에 저장됩니다):", "");
            if (input && input.trim().length > 0) {
                GITHUB_TOKEN = input.trim();
                localStorage.setItem('gh_token', GITHUB_TOKEN);
                return true;
            }
            alert("토큰이 없으면 깃허브 전송이 안 돼, 형!");
            return false;
        }
        return true;
    }

    function resetToken() {
        if (confirm("저장된 깃허브 토큰을 지울까?")) {
            localStorage.removeItem('gh_token');
            GITHUB_TOKEN = "";
            alert("삭제 완료! 다음 전송 때 새로 물어볼게.");
        }
    }

    async function pushToGithub(type, mins, dateStr) {
        const cooldownVal = Number(currentParsed?.cooldownMins) || 0;
        if (!checkToken()) return;
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
        let sha = "";
        let currentData = {};
        try {
            const res = await fetch(url + '?t=' + Date.now(), { headers: { "Authorization": `Bearer ${GITHUB_TOKEN}` } });
            if (res.ok) {
                const json = await res.json();
                sha = json.sha;
                const content = decodeURIComponent(atob(json.content).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                currentData = JSON.parse(content);
            }
        } catch (e) { console.log("기존 데이터 없음 또는 에러:", e); }

        if (!currentData[dateStr]) {
            currentData[dateStr] = { strong: 0, cooldown: 0, swim: 0, run: 0 };
        }
        if (currentData[dateStr].cooldown === undefined) currentData[dateStr].cooldown = 0;

        if (type === 'strong') {
            const oldData = currentData[dateStr] || {};
            currentData[dateStr] = {
                strong: mins - cooldownVal,
                cooldown: cooldownVal,
                swim: oldData.swim || 0,
                run: oldData.run || 0,
                workout: oldData.workout || null
            };
        } else if (type === 'swim') {
            currentData[dateStr].swim = mins;
        } else if (type === 'run') {
            currentData[dateStr].run = mins;
        }

        if (type === 'strong' && currentParsed) {
            currentData[dateStr].workout = {
                title: currentParsed.workoutTitle,
                datetime: currentParsed.dateTime,
                duration: mins,
                totalSets: currentParsed.totalSets,
                exercises: currentParsed.exerciseList.map(function(ex) {
                    return { name: ex.name, sets: ex.sets, warms: ex.warms || 0, drops: ex.drops || 0, fails: ex.fails || 0 };
                })
            };
        }

        const jsonStr = JSON.stringify(currentData, null, 2);
        const encodedContent = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g,
            function(match, p1) { return String.fromCharCode('0x' + p1); }));
        const putRes = await fetch(url, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: `Update ${type} at ${dateStr}`, content: encodedContent, sha: sha })
        });
        if (putRes.ok) {
            alert(`✅ strong ${mins - cooldownVal}분 / cooldown ${cooldownVal}분 저장 완료!`);
            await rebuildLogTxt(currentData);
        } else {
            const errorDetail = await putRes.json();
            if (putRes.status === 401 || putRes.status === 403) {
                alert("❌ 토큰 권한 문제야.");
            } else {
                alert(`❌ 저장 실패: ${errorDetail.message}`);
            }
        }
    }

    async function recordManual(type) {
        const mins = prompt(`${type === 'swim' ? '수영' : '달리기'} 몇 분 했어?`, "0");
        if (!mins || isNaN(mins)) return;
        const cardio = parseInt(mins);
        const now = new Date();
        const koreaDate = new Date(now.getTime() + (9 * 60 * 60 * 1000));
        const dateStr = koreaDate.toISOString().split('T')[0].replace(/-/g, '');
        await pushToGithub(type, cardio, dateStr);
    }

    // 사진 선택 / 촬영 공통 처리
    function onPhotoPicked() {
        const label = document.getElementById('fileLabel');
        label.innerText = "✅ 사진 선택 완료";
        label.classList.add('btn-done');
        if (document.getElementById("logInput").value.trim()) {
            setTimeout(processWorkout, 300);
        }
    }
    document.getElementById('imageInput').onchange = onPhotoPicked;
    document.getElementById('cameraInput').onchange = function() {
        // 촬영본을 imageInput 쪽으로 옮겨서 이후 로직(EXIF 등)을 그대로 재사용
        const input = document.getElementById('imageInput');
        input.files = this.files;
        onPhotoPicked();
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultImg = document.getElementById('resultImage');
    const resultContainer = document.getElementById('resultContainer');

    async function pasteLog() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) document.getElementById('logInput').value = text;
        } catch (err) { alert("붙여넣기 권한이 필요합니다."); }
    }

    function loadTestData() {
        const testLog = `LEGS#2

세트 2: 20 kg × 12

노트: 무릎 잠김

Lunge (Smith Muchine)
W1: 20 kg × 10 [워밍업]
세트 1: 25 kg × 12
세트 2: 25 kg × 12
세트 3: 25 kg × 12

Standing Calf Raise (Bodyweight)
W1: 12 렙 [워밍업]

Standing Calf Raise (Dumbbell)
세트 1: 5 kg × 12
세트 2: 5 kg × 15
세트 3: 5 kg × 12

Hanging Leg Raise
W1: 14 렙 [워밍업]
세트 1: 17 렙
세트 2: 13 렙
세트 3: 13 렙

Walking
세트 1: 10:00
https://link.strong.app/swnxgzke`;

        document.getElementById('logInput').value = testLog;

        fetch('sample.jpg')
            .then(function(r) { return r.blob(); })
            .then(function(blob) {
                const file = new File([blob], 'sample.jpg', { type: blob.type, lastModified: blob.lastModified });
                const dt = new DataTransfer();
                dt.items.add(file);
                const input = document.getElementById('imageInput');
                input.files = dt.files;
                onPhotoPicked();
            })
            .catch(function() {
                alert('sample.jpg 파일이 같은 폴더에 없어!');
            });
    }
    window._testPhotoTime = new Date('2026-03-14T13:30:00');

    window.addEventListener("load", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const URLLog = urlParams.get('log');
        if (URLLog && !URLLog.includes("{clipboard}")) {
            document.getElementById("logInput").value = decodeURIComponent(URLLog);
        } else {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const clipboardText = await navigator.clipboard.readText();
                    if (clipboardText && clipboardText.trim().length > 0) {
                        document.getElementById("logInput").value = clipboardText;
                    }
                }
            } catch (err) { console.log("클립보드 읽기 실패: ", err); }
        }
    });

    function parseTimeString(timeStr) {
        const parts = timeStr.match(/(오전|오후)\s*(\d+):(\d+)/);
        if (!parts) return null;
        let hours = parseInt(parts[2]);
        const minutes = parseInt(parts[3]);
        if (parts[1] === "오후" && hours < 12) hours += 12;
        else if (parts[1] === "오전" && hours === 12) hours = 0;
        return { hours, minutes };
    }

    function parseWorkout(rawText, photoTime) {
        const paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(p => p !== "");
        const headerLines = paragraphs[0].split('\n');
        const workoutTitle = headerLines[0];
        const dateTime = headerLines[1] || "";

        const timeMatch = dateTime.match(/(오전|오후)\s*\d+:\d+/);
        const start = timeMatch ? parseTimeString(timeMatch[0]) : {hours:0, minutes:0};

        const dateParts = dateTime.match(/(\d+)년\s*(\d+)월\s*(\d+)일/);
        const fileDate = dateParts ? `${dateParts[1]}${dateParts[2].padStart(2, '0')}${dateParts[3].padStart(2, '0')}` : "00000000";

        let endTotal = photoTime.getHours() * 60 + photoTime.getMinutes();
        let startTotal = start.hours * 60 + start.minutes;
        if (endTotal < startTotal) endTotal += 1440;
        const minutes = endTotal - startTotal;

        let totalSets = 0, exerciseList = [];
        paragraphs.slice(1).forEach(para => {
            const lines = para.split('\n').map(l => l.trim());
            let foundName = "", setsInPara = 0, dropSets = 0, failSets = 0, warmSets = 0, hasRecord = false, noteText = "";
            let setReps = [], warmReps = [], dropReps = [], orderedSets = [];
            lines.forEach(line => {
                const isSet = /^(세트\s*\d+|W\d*|F\d*|D\d*|Set\s*\d+):/i.test(line);
                if (isSet) {
                    hasRecord = true;
                    const isWarm = /^W\d*:/i.test(line) || line.includes('[워밍업]');
                    const isDrop = line.includes('[드롭') || /^D\d*:/i.test(line);
                    const isFail = line.includes('[실패]');
                    const timeMatch = line.match(/(\d+):(\d+)/);
                    const repsMatch = line.match(/[×x]\s*(\d+)|(\d+)\s*(?:렙|회)/i);
                    const reps = timeMatch
                        ? timeMatch[1] + ':' + timeMatch[2]
                        : repsMatch ? parseInt(repsMatch[1] || repsMatch[2]) : 0;
                    if (isWarm) {
                        warmSets++;
                        warmReps.push(reps);
                        orderedSets.push({type:'warm', reps:reps});
                    } else {
                        totalSets++;
                        if (isDrop) { dropSets++; dropReps.push(reps); orderedSets.push({type:'drop', reps:reps}); }
                        else if (isFail) { failSets++; setsInPara++; setReps.push(reps); orderedSets.push({type:'normal', reps:reps}); }
                        else { setsInPara++; setReps.push(reps); orderedSets.push({type:'normal', reps:reps}); }
                    }
                } else if (line.startsWith('노트:')) {
                    noteText = line.replace('노트:', '').trim();
                } else if (!foundName && isNaN(line[0]) && !line.includes("kg") && !line.startsWith("http")) {
                    foundName = line;
                }
            });
            if (foundName && (hasRecord || warmSets > 0)) exerciseList.push({ name: foundName, sets: setsInPara, drops: dropSets, fails: failSets, warms: warmSets, note: noteText, setReps: setReps, warmReps: warmReps, dropReps: dropReps, orderedSets });
        });

        let cooldownMins = 0;
        for (let i = exerciseList.length - 1; i >= 0; i--) {
            const ex = exerciseList[i];
            const allSets = ex.orderedSets || [];
            const hasDuration = allSets.some(s => typeof s.reps === 'string' && s.reps.includes(':'));
            const hasWeight = allSets.some(s => typeof s.reps === 'number');
            if (hasDuration && !hasWeight) {
                allSets.forEach(s => {
                    if (typeof s.reps === 'string' && s.reps.includes(':')) {
                        cooldownMins += parseInt(s.reps.split(':')[0]);
                    }
                });
            } else {
                break;
            }
        }

        return { workoutTitle, dateTime, fileDate, minutes, totalSets, exerciseList, cooldownMins };
    }

    // 타입별 draw 함수 매핑 — processWorkout에서 분기문 없이 호출
    const TYPE_DRAWERS = { A: drawTypeA, B: drawTypeB, C: drawTypeC };

    async function processWorkout() {
        const rawText = document.getElementById('logInput').value;
        const file = document.getElementById('imageInput').files[0];
        if (!rawText || !file) return alert("텍스트와 사진을 모두 넣어주세요!");

        let photoTime;
        if (file.name === 'sample.jpg' && window._testPhotoTime) {
            photoTime = window._testPhotoTime;
        } else {
            try {
                const buffer = await file.arrayBuffer();
                const tags = ExifReader.load(buffer);
                const exifDate = tags.DateTimeOriginal?.description || tags.DateTime?.description;
                if (exifDate) {
                    photoTime = new Date(exifDate.replace(/^(\d+):(\d+):(\d+)/, '$1-$2-$3'));
                } else {
                    photoTime = new Date(file.lastModified);
                }
            } catch (err) {
                photoTime = new Date(file.lastModified);
            }
        }

        const parsed = parseWorkout(rawText, photoTime);
        currentMinutes = parsed.minutes;
        currentFileDate = parsed.fileDate;
        currentParsed = parsed;

        const duration = `${Math.floor(currentMinutes/60)}h ${currentMinutes%60}m`;

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                document.fonts.ready.then(() => {
                    const drawFn = TYPE_DRAWERS[selectedType] || drawTypeA;
                    Promise.resolve(
                        drawFn(img, parsed.workoutTitle, parsed.dateTime, duration, parsed.totalSets, parsed.exerciseList)
                    ).then(function() {
                        resultImg.src = canvas.toDataURL('image/png');
                        resultContainer.style.display = 'block';

                        const pushBtn = document.getElementById('pushGithubBtn');
                        const snapParsed = parsed;
                        pushBtn.onclick = function() {
                            currentParsed = snapParsed;
                            pushToGithub('strong', currentMinutes, currentFileDate);
                        };
                        pushBtn.innerText = "🚀 깃허브로 데이터 쏘기";
                        pushBtn.classList.remove('btn-done');
                    });
                });
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    async function rebuildLogTxt(currentData) {
        if (!checkToken()) return;
        const lines = [];
        const sortedDates = Object.keys(currentData).sort();
        for (const dateStr of sortedDates) {
            const item = currentData[dateStr];
            const strong = item.strong || 0;
            const cardio = (item.cooldown || 0) + (item.swim || 0) + (item.run || 0);
            const formattedDate = dateStr.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
            lines.push(`${formattedDate},${strong},${cardio}`);
        }
        const content = lines.join('\n') + '\n';
        const encoded = btoa(unescape(encodeURIComponent(content)));
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/log.txt`;
        let sha = "";
        try {
            const res = await fetch(url + '?t=' + Date.now(), { headers: { "Authorization": `Bearer ${GITHUB_TOKEN}` } });
            if (res.ok) { const json = await res.json(); sha = json.sha; }
        } catch (e) { console.log("log.txt sha load fail", e); }

        const putRes = await fetch(url, {
            method: "PUT",
            headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Rebuild log.txt", content: encoded, sha })
        });
        if (!putRes.ok) {
            const err = await putRes.json();
            console.error("log.txt rebuild fail", err);
        }
    }

    function downloadData() {
        const fileName = `ssimg_${currentFileDate}_${currentMinutes}.txt`;
        const blob = new Blob(["workout"], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
    }

    // ── 공통 헤더: 상단 그라디언트 + 타이틀 + 메타 + 구분선 ──────────────────
    function drawHeaderBlock(iX, rX, workoutTitle, dateTime, duration, totalSets) {
        const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
        topGrad.addColorStop(0,   "rgba(0,0,0,0.82)");
        topGrad.addColorStop(0.6, "rgba(0,0,0,0.4)");
        topGrad.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 420);

        ctx.fillStyle = "#ff4757";
        ctx.font = "700 140px 'Archivo Black'";
        ctx.textAlign = "center";
        ctx.fillText(workoutTitle.toUpperCase(), canvas.width / 2, 158);

        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "400 30px 'Inter'";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", canvas.width / 2, 205);

        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(iX, 226); ctx.lineTo(rX, 226); ctx.stroke();
    }

    function drawSignature(y) {
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width / 2, y);
    }

    // ── 공통 하단 운동 태그 목록 (A, B 공용) ─────────────────────────────────
    function drawExerciseTags(exerciseList) {
        const iX = 70;
        const tagFont = "700 22px 'Inter'";
        ctx.font = tagFont;
        const tagPadX = 20, tagGap = 10, tagH = 46, tagLineH = 56;
        const tagMaxW = canvas.width - iX * 2;

        const tagRows = [];
        let curRow = [], curRowW = 0;
        exerciseList.forEach(function(ex) {
            const tw = ctx.measureText(ex.name).width + tagPadX * 2;
            if (curRow.length > 0 && curRowW + tw + tagGap > tagMaxW) {
                tagRows.push({ tags: curRow, w: curRowW - tagGap });
                curRow = []; curRowW = 0;
            }
            curRow.push({ ex: ex, tw: tw });
            curRowW += tw + tagGap;
        });
        if (curRow.length > 0) tagRows.push({ tags: curRow, w: curRowW - tagGap });

        const tagTotalH = tagRows.length * tagLineH;
        let tagY = canvas.height - 55 - tagTotalH;

        const botGrad = ctx.createLinearGradient(0, tagY - 60, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.65)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, tagY - 60, canvas.width, canvas.height - (tagY - 60));

        tagRows.forEach(function(row) {
            let tx = Math.round((canvas.width - row.w) / 2);
            row.tags.forEach(function(item) {
                const ex = item.ex, tw = item.tw, textX = tx + tagPadX;

                ctx.fillStyle = "rgba(255,255,255,0.10)";
                roundRect(ctx, tx, tagY, tw, tagH, 7);
                ctx.fill();

                ctx.font = tagFont;
                ctx.textAlign = "left";
                let charX = textX;
                for (let ci = 0; ci < ex.name.length; ci++) {
                    const ch = ex.name[ci];
                    ctx.fillStyle = /[^a-zA-Z ]/.test(ch) ? "#ff4757" : "rgba(255,255,255,0.85)";
                    ctx.fillText(ch, charX, tagY + 30);
                    charX += ctx.measureText(ch).width;
                }

                const bW = 7, bH = 5, bGap = 3;
                const oSets = ex.orderedSets || [];
                let bx = textX;
                oSets.slice(0, 6).forEach(function(os) {
                    ctx.fillStyle = os.type === 'warm' ? '#F0B83B' : os.type === 'drop' ? '#784CD8' : '#ff4757';
                    ctx.fillRect(bx, tagY + 38, bW, bH);
                    bx += bW + bGap;
                });

                tx += tw + tagGap;
            });
            tagY += tagLineH;
        });
    }

    // ─── TYPE A (구 Type H, 기본형) — 사진 + 헤더 + 하단 태그 목록만 ─────────
    function drawTypeA(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const iX = 70, rX = canvas.width - 70;
        drawHeaderBlock(iX, rX, workoutTitle, dateTime, duration, totalSets);
        drawExerciseTags(exerciseList);
        drawSignature(canvas.height - 22);
    }

    // ─── TYPE B (구 Type G, 레이더 차트) ─────────────────────────────────────
    function drawTypeB(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const iX = 30, rX = canvas.width - 70;
        drawHeaderBlock(iX, rX, workoutTitle, dateTime, duration, totalSets);

        const PART_ORDER = [
            'Calf','Hamstring','Quads','Glute','Core','Lower Back',
            'Lat','Traps','Shoulder','Chest','Triceps','Biceps','Forearm','Cardio'
        ];
        const PART_ABBR = {
            'Calf':'clf','Hamstring':'hmstrng','Quads':'qds','Glute':'glt',
            'Core':'cr','Lower Back':'lbck','Lat':'lts','Traps':'trps',
            'Shoulder':'shldr','Chest':'chst','Triceps':'trcps',
            'Biceps':'bcps','Forearm':'frm','Cardio':'crd'
        };
        const MAP_URL = "https://raw.githubusercontent.com/" + GITHUB_REPO + "/main/exercise_map.csv?t=" + Date.now();

        return fetch(MAP_URL).then(function(r){ return r.text(); }).then(function(csv) {
            const exMap = {};
            csv.split('\n').slice(1).forEach(function(line) {
                const p = line.split(',');
                if (!p[0] || !p[0].trim()) return;
                exMap[p[0].trim()] = { main:(p[1]||'').trim(), sub:(p[2]||'').trim() };
            });
            drawRadar(exMap);
        }).catch(function() { drawRadar({}); });

        function drawRadar(exMap) {
            const scores = {};
            PART_ORDER.forEach(function(p){ scores[p] = 0; });
            exerciseList.forEach(function(ex) {
                const map = exMap[ex.name];
                if (!map) return;
                const sets = ex.sets + (ex.drops||0) + (ex.fails||0);
                if (map.main && scores[map.main] !== undefined) scores[map.main] += sets * 1.0;
                if (map.sub  && scores[map.sub]  !== undefined) scores[map.sub]  += sets * 0.5;
            });
            const maxVal = Math.max.apply(null, Object.values(scores).concat([1]));

            const n = PART_ORDER.length;
            const cx = canvas.width / 2, cy = canvas.height / 2 - 20, r = 260;
            const angle = function(i) { return (Math.PI * 2 / n) * i - Math.PI / 2; };
            const pt = function(i, ratio) {
                return [cx + r * ratio * Math.cos(angle(i)), cy + r * ratio * Math.sin(angle(i))];
            };

            [0.25, 0.5, 0.75, 1.0].forEach(function(ratio) {
                ctx.beginPath();
                for (let i = 0; i < n; i++) {
                    const p = pt(i, ratio);
                    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
                }
                ctx.closePath();
                ctx.strokeStyle = "rgba(255,255,255,0.2)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            for (let i = 0; i < n; i++) {
                const p = pt(i, 1);
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]);
                ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1; ctx.stroke();
            }

            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const p = pt(i, 1.0);
                if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
            }
            ctx.closePath();
            ctx.strokeStyle = "rgba(255, 71, 87, 0.5)"; ctx.lineWidth = 3; ctx.stroke();

            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 12;
            ctx.beginPath();
            PART_ORDER.forEach(function(part, i) {
                const ratio = Math.min(scores[part] / maxVal, 1);
                const p = pt(i, Math.max(ratio, 0.03));
                if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
            });
            ctx.closePath();
            ctx.fillStyle = "rgba(255,71,87,0.5)"; ctx.fill();
            ctx.strokeStyle = "#ff4757"; ctx.lineWidth = 3.5; ctx.stroke();
            ctx.restore();

            PART_ORDER.forEach(function(part, i) {
                const ratio = Math.min(scores[part] / maxVal, 1);
                const p = pt(i, Math.max(ratio, 0.03));
                ctx.beginPath();
                ctx.arc(p[0], p[1], scores[part] > 0 ? 8 : 4, 0, Math.PI*2);
                ctx.fillStyle = scores[part] > 0 ? "#ff4757" : "rgba(255,255,255,0.2)";
                ctx.fill();
            });

            PART_ORDER.forEach(function(part, i) {
                const p = pt(i, 1.2);
                const abbr = PART_ABBR[part] || part;
                const ang = angle(i);
                let align = 'center';
                if (Math.cos(ang) > 0.3) align = 'left';
                if (Math.cos(ang) < -0.3) align = 'right';

                ctx.textAlign = align;
                ctx.fillStyle = scores[part] > 0 ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.35)";
                ctx.font = "700 24px 'Inter'";
                ctx.fillText(abbr, p[0], p[1]);

                if (scores[part] > 0) {
                    ctx.textAlign = align;
                    ctx.fillStyle = "#ffaaaa";
                    ctx.font = "400 20px 'Inter'";
                    ctx.fillText(scores[part] % 1 === 0 ? scores[part] : scores[part].toFixed(1), p[0], p[1] + 26);
                }
            });

            drawExerciseTags(exerciseList);
            drawSignature(canvas.height - 22);
        }
    }

    // ─── TYPE C (구 Type F, Fleek2) ──────────────────────────────────────────
    function drawTypeC(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const iX = 40, rX = canvas.width - 40;
        const headEnd = 240;
        const signY = canvas.height - 22;
        const availH = canvas.height - headEnd - 50;

        function calcLayout(R) {
            const gap = Math.round(R * 0.1);
            const exGap = Math.round(R * 0.5);
            const exFont = Math.max(20, Math.round(R * 1.2));
            const maxPRraw = Math.floor((canvas.width - iX * 2 + gap) / (R * 2 + gap));
            const half = Math.ceil(exerciseList.length / 2);
            const heights = exerciseList.map(function(ex) {
                const total = (ex.orderedSets || []).length || ((ex.warms||0) + ex.sets + (ex.drops||0));
                const lines = Math.max(1, Math.ceil(total / Math.floor(maxPRraw / 2)));
                return exFont + 8 + lines * (R * 1 + 2) + exGap;
            });
            const leftH  = heights.slice(0, half).reduce(function(s,h){ return s+h; }, 0);
            const rightH = heights.slice(half).reduce(function(s,h){ return s+h; }, 0);
            return { R, gap, exGap, exFont, maxPR: Math.floor(maxPRraw / 2), heights, totalH: Math.max(leftH, rightH), half };
        }

        let L = calcLayout(25);
        if (L.totalH > availH) L = calcLayout(23);
        if (L.totalH > availH) L = calcLayout(21);
        if (L.totalH > availH) L = calcLayout(16);

        const { R, gap, exFont, maxPR, heights, half } = L;
        const colW = Math.floor((canvas.width - iX * 2 - 40) / 2);
        const col2X = iX + colW + 40;
        const repsFont = Math.max(14, Math.round(R * 0.72));

        drawHeaderBlock(iX, rX, workoutTitle, dateTime, duration, totalSets);

        const totalListH = L.totalH;
        const listStartY = canvas.height - 50 - totalListH;
        const gradStart = Math.max(headEnd, listStartY - 80);
        const botGrad = ctx.createLinearGradient(0, gradStart, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.72)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, gradStart, canvas.width, canvas.height - gradStart);

        const bottomMargin = 90;
        const leftStart  = canvas.height - bottomMargin - heights.slice(0, half).reduce(function(s,h){return s+h;},0);
        const rightStart = canvas.height - bottomMargin - heights.slice(half).reduce(function(s,h){return s+h;},0);

        exerciseList.forEach(function(ex, i) {
            const isRight = i >= half;
            const col = isRight ? 1 : 0;
            const row = isRight ? i - half : i;
            const startX = col === 0 ? iX : col2X;
            const endX   = col === 0 ? iX + colW : col2X + colW;

            const colHeights = isRight ? heights.slice(half) : heights.slice(0, half);
            const rowOffset  = colHeights.slice(0, row).reduce(function(s,h){return s+h;},0);
            const ex_y = (isRight ? rightStart : leftStart) + rowOffset;

            const wReps = ex.warmReps || [], sReps = ex.setReps || [], dReps = ex.dropReps || [];
            const allSets = ex.orderedSets && ex.orderedSets.length
                ? ex.orderedSets
                : (function() {
                    const arr = [];
                    for (let w=0; w<(ex.warms||0); w++) arr.push({type:'warm',  reps: wReps[w]||0});
                    for (let s=0; s<ex.sets;       s++) arr.push({type:'normal', reps: sReps[s]||0});
                    for (let d=0; d<(ex.drops||0); d++) arr.push({type:'drop',   reps: dReps[d]||0});
                    return arr;
                })();

            const lines = Math.max(1, Math.ceil(allSets.length / maxPR));

            for (let line = 0; line < lines; line++) {
                const linesets = allSets.slice(line * maxPR, (line + 1) * maxPR);
                const cY = ex_y + exFont + 8 + line * (R * 1 + 2);

                if (line === 0) {
                    ctx.fillStyle = "rgba(255,255,255,0.92)";
                    ctx.font = "700 " + exFont + "px 'Inter'";
                    ctx.textAlign = "left";
                    let name = ex.name;
                    const circlesW = linesets.length * (R * 1.4 + gap) - gap;
                    const nameMaxW = Math.max(60, colW - circlesW - 20);
                    if (ctx.measureText(name).width > nameMaxW) {
                        while (name.length > 1 && ctx.measureText(name + "..").width > nameMaxW) name = name.slice(0,-1);
                        name += "..";
                    }
                    ctx.fillText(name, startX, cY + R + exFont * 0.36);
                }

                const circlesW = linesets.length * (R * 1.4 + gap) - gap;
                let cX = endX - circlesW;

                linesets.forEach(function(s, si) {
                    const color = s.type==='warm' ? '#F0B83B' : s.type==='drop' ? '#784CD8' : '#ff4757';
                    const rectW = R * 1.4, rectH = R * 2, cornerRadius = 8;

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.roundRect(cX, cY + (R - rectH/2), rectW, rectH, cornerRadius);
                    ctx.fill();

                    let label;
                    const globalIdx = line * maxPR + si;
                    if (typeof s.reps === 'string' && s.reps.includes(':')) label = s.reps;
                    else if (s.reps > 0) label = String(s.reps);
                    else label = s.type==='warm' ? 'W' : s.type==='drop' ? 'D' :
                        String(allSets.slice(0, globalIdx+1).filter(function(t){return t.type==='normal';}).length);

                    const isTime = typeof label === 'string' && label.includes(':');
                    ctx.fillStyle = "rgba(255,255,255,0.95)";
                    ctx.textAlign = "center";

                    if (isTime) {
                        const parts = label.split(':');
                        const timeFontSize = Math.round(repsFont * 1);
                        ctx.font = "700 " + timeFontSize + "px 'Inter'";
                        ctx.fillText(parts[0] + ':', cX + rectW / 2, cY + R - (timeFontSize * 0.2));
                        ctx.fillText(parts[1], cX + rectW / 2, cY + R + (timeFontSize * 0.9));
                    } else {
                        const normalFontSize = Math.round(repsFont * 1.2);
                        ctx.font = "700 " + normalFontSize + "px 'Inter'";
                        ctx.fillText(label, cX + rectW / 2, cY + R + normalFontSize * 0.36);
                    }
                    cX += rectW + gap;
                });
            }

            if (ex.note) {
                const lastCY = ex_y + exFont + 8 + (lines - 1) * (R * 2 + 8);
                ctx.fillStyle = "rgba(255,210,75,0.78)";
                ctx.font = "400 " + Math.max(16, Math.round(exFont * 0.65)) + "px 'Inter'";
                ctx.textAlign = "left";
                ctx.fillText(ex.note, startX, lastCY + R * 2 + 20);
            }
        });

        drawSignature(signY);
    }

    // ─── 유틸: 둥근 사각형 ───────────────────────────────────────────────────
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    (function(){
        const params = new URLSearchParams(location.search);
        const data = params.get("log");
        if (data) {
            document.getElementById("logInput").value = decodeURIComponent(data);
            setTimeout(()=>{ document.getElementById("imageInput").click(); }, 500);
        }
    })();
</script>
