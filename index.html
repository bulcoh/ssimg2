    function checkToken() {
        if (!GITHUB_TOKEN) {
            const input = prompt("🔐 깃허브 토큰이 없습니다.\n처음 한 번만 입력해주세요. (브라우저에 저장됩니다):", "");
            if (input && input.trim().length > 0) {
                GITHUB_TOKEN = input.trim();
                localStorage.setItem('gh_token', GITHUB_TOKEN);
                return true;
            }
            alert("토큰이 없으면 깃허브 전송이 안 돼, 형!");
            return false;
        }
        return true;
    }

    function resetToken() {
        if(confirm("저장된 깃허브 토큰을 지울까?")) {
            localStorage.removeItem('gh_token');
            GITHUB_TOKEN = "";
            alert("삭제 완료! 다음 전송 때 새로 물어볼게.");
        }
    }

    async function pushToGithub(type, mins, dateStr) {

        const cooldownVal = Number(currentParsed?.cooldownMins) || 0;
        if (!checkToken()) return;
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
        let sha = "";
        let currentData = {};
        try {
            const res = await fetch(url, { headers: { "Authorization": `Bearer ${GITHUB_TOKEN}` } });
            if (res.ok) {
                const json = await res.json();
                sha = json.sha;
                const content = decodeURIComponent(atob(json.content).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                currentData = JSON.parse(content);
            }
        } catch (e) { console.log("기존 데이터 없음 또는 에러:", e); }
        if (!currentData[dateStr])
            currentData[dateStr] = {
                strong: 0,
                cooldown: 0,
                swim: 0,
                run: 0
            };

        // 구버전 호환
        if (currentData[dateStr].cooldown === undefined) {
            currentData[dateStr].cooldown = 0;
        }

        // 버튼별 저장 규칙
if (type === 'strong') {

    const oldData =
        currentData[dateStr] || {};



    currentData[dateStr] = {
        strong: mins - cooldownVal,

        // cooldown 강제 생성
        cooldown: cooldownVal,

        // 기존 수영/달리기 유지
        swim: oldData.swim || 0,
        run: oldData.run || 0,

        // 기존 workout 유지
        workout: oldData.workout || null
    };

} else if (type === 'swim') {

    currentData[dateStr].swim = mins;

} else if (type === 'run') {

    currentData[dateStr].run = mins;
}
        

        if (type === 'strong' && currentParsed) {
            currentData[dateStr].workout = {
                title: currentParsed.workoutTitle,
                datetime: currentParsed.dateTime,
                duration: mins,
                totalSets: currentParsed.totalSets,
                exercises: currentParsed.exerciseList.map(function(ex) {
                    return {
                        name: ex.name,
                        sets: ex.sets,
                        warms: ex.warms || 0,
                        drops: ex.drops || 0,
                        fails: ex.fails || 0
                    };
                })
            };
        }
        const jsonStr = JSON.stringify(currentData, null, 2);
        const encodedContent = btoa(encodeURIComponent(jsonStr).replace(/%([0-9A-F]{2})/g,
            function(match, p1) { return String.fromCharCode('0x' + p1); }));
        const putRes = await fetch(url, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: `Update ${type} at ${dateStr}`, content: encodedContent, sha: sha })
        });
        if (putRes.ok) {
            alert(`✅ strong ${mins - cooldownVal}분 / cooldown ${cooldownVal}분 저장 완료!`);
            await rebuildLogTxt(currentData);

            const errorDetail = await putRes.json();
            if (putRes.status === 401 || putRes.status === 403) {
                alert("❌ 토큰 권한 문제야.");
            } else {
                alert(`❌ 저장 실패: ${errorDetail.message}`);
            }
        }
    }

async function pushLogTxt(mins, cooldown, dateStr, cardio) {
    if (!checkToken()) return;
    const formattedDate = dateStr.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
    const effectiveCardio = (cooldown || 0) + (cardio || 0);
    const newLine = `${formattedDate},${mins - (cooldown||0)},${effectiveCardio}`;
    
    const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/log.txt`;
    let sha = "";
    let lines = [];
    
    try {
        const res = await fetch(url, { headers: { "Authorization": `Bearer ${GITHUB_TOKEN}` } });
        if (res.ok) {
            const json = await res.json();
            sha = json.sha;
            const content = atob(json.content.replace(/\n/g, ''));
            lines = content.split('\n').filter(l => l.trim() !== '');
        }
    } catch (e) { console.log("log.txt 읽기 실패:", e); }
    
    const idx = lines.findIndex(l => l.startsWith(formattedDate));
    if (idx >= 0) lines[idx] = newLine;
    else lines.push(newLine);
    
    lines.sort();
    
    const newContent = lines.join('\n') + '\n';
    const encoded = btoa(unescape(encodeURIComponent(newContent)));
    
    const putRes = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: `Update log at ${formattedDate}`, content: encoded, sha: sha })
    });
    
    if (!putRes.ok) {
        const err = await putRes.json();
        alert(`❌ log.txt 저장 실패: ${err.message}`);
    }
}
async function pushCardioToLog(cardioMins, dateStr) {
    if (!checkToken()) return;

    const formattedDate = dateStr.replace(
        /(\d{4})(\d{2})(\d{2})/,
        '$1-$2-$3'
    );

    const url =
        `https://api.github.com/repos/${GITHUB_REPO}/contents/log.txt`;

    let sha = "";
    let lines = [];

    try {
        const res = await fetch(url, {
            headers: {
                "Authorization": `Bearer ${GITHUB_TOKEN}`
            }
        });

        if (res.ok) {
            const json = await res.json();
            sha = json.sha;

            const content = atob(
                json.content.replace(/\n/g, '')
            );

            lines = content
                .split('\n')
                .filter(l => l.trim() !== '');
        }
    } catch (e) {
        console.log("log.txt 읽기 실패:", e);
    }

    // 날짜 찾기
    const idx = lines.findIndex(
        l => l.startsWith(formattedDate)
    );

    if (idx >= 0) {
        // 기존 날짜 있으면 유산소만 수정
        const parts = lines[idx].split(',');

        const weight = parseInt(parts[1]) || 0;
        const oldCardio = parseInt(parts[2]) || 0;

        // 누적되게
        const newCardio = oldCardio + cardioMins;

        lines[idx] =
            `${formattedDate},${weight},${newCardio}`;

    } else {
        // 오늘 웨이트 안 했으면 생성
        lines.push(
            `${formattedDate},0,${cardioMins}`
        );
    }

    lines.sort();

    const newContent =
        lines.join('\n') + '\n';

    const encoded =
        btoa(unescape(
            encodeURIComponent(newContent)
        ));

    const putRes = await fetch(url, {
        method: "PUT",
        headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: `Update cardio ${formattedDate}`,
            content: encoded,
            sha: sha
        })
    });

    if (putRes.ok) {
        alert(`✅ 유산소 ${cardioMins}분 기록 완료!`);
    } else {
        const err = await putRes.json();
        alert(`❌ 저장 실패: ${err.message}`);
    }
}

async function recordManual(type) {
    const mins = prompt(
        `${type === 'swim' ? '수영' : '달리기'} 몇 분 했어?`,
        "0"
    );

    if (!mins || isNaN(mins)) return;

    const cardio = parseInt(mins);

    // 한국 날짜 기준
    const now = new Date();
    const koreaDate = new Date(
        now.getTime() + (9 * 60 * 60 * 1000)
    );

    const dateStr = koreaDate
        .toISOString()
        .split('T')[0]
        .replace(/-/g, '');
        
    await pushToGithub(type, cardio, dateStr);
    //await pushCardioToLog(cardio, dateStr);
}

    function parseTimeString(timeStr) {
        const parts = timeStr.match(/(오전|오후)\s*(\d+):(\d+)/);
        if (!parts) return null;
        let hours = parseInt(parts[2]);
        const minutes = parseInt(parts[3]);
        if (parts[1] === "오후" && hours < 12) hours += 12;
        else if (parts[1] === "오전" && hours === 12) hours = 0;
        return { hours, minutes };
    }

    function parseWorkout(rawText, photoTime) {
        const paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(p => p !== "");
        const headerLines = paragraphs[0].split('\n');
        const workoutTitle = headerLines[0];
        const dateTime = headerLines[1] || "";
        
        const timeMatch = dateTime.match(/(오전|오후)\s*\d+:\d+/);
        const start = timeMatch ? parseTimeString(timeMatch[0]) : {hours:0, minutes:0};
        
        const dateParts = dateTime.match(/(\d+)년\s*(\d+)월\s*(\d+)일/);
        const fileDate = dateParts ? `${dateParts[1]}${dateParts[2].padStart(2, '0')}${dateParts[3].padStart(2, '0')}` : "00000000";
        

        
        let endTotal = photoTime.getHours() * 60 + photoTime.getMinutes();
        let startTotal = start.hours * 60 + start.minutes;
        if (endTotal < startTotal) endTotal += 1440;
        const minutes = endTotal - startTotal;

        let totalSets = 0, exerciseList = [];
        paragraphs.slice(1).forEach(para => {
            const lines = para.split('\n').map(l => l.trim());
            let foundName = "", setsInPara = 0, dropSets = 0, failSets=0, warmSets = 0, hasRecord = false, noteText = "";
            let setReps = [], warmReps = [], dropReps = [], orderedSets = [];
            lines.forEach(line => {
                const isSet = /^(세트\s*\d+|W\d*|F\d*|D\d*|Set\s*\d+):/i.test(line);
                if (isSet) {
                    hasRecord = true;
                    const upper = line.toUpperCase();
                    const isWarm = /^W\d*:/i.test(line) || line.includes('[워밍업]');
                    const isDrop = line.includes('[드롭') || /^D\d*:/i.test(line);
                    const isFail = line.includes('[실패]');
                    const timeMatch = line.match(/(\d+):(\d+)/);
                    const repsMatch = line.match(/[×x]\s*(\d+)|(\d+)\s*(?:렙|회)/i);
                    const reps = timeMatch
                        ? timeMatch[1] + ':' + timeMatch[2]
                        : repsMatch ? parseInt(repsMatch[1]||repsMatch[2]) : 0;
                    if (isWarm) {
                        warmSets++;  // 총세트 카운트 제외, 표기만
                        warmReps.push(reps);
                        orderedSets.push({type:'warm', reps:reps});
                    } else {
                    totalSets++;
                    //if (isDrop) { dropSets++; dropReps.push(reps); }
                    //else if (isFail) { failSets++; setsInPara++; setReps.push(reps); }
                    //else { setsInPara++; setReps.push(reps); }
                    if (isDrop) { dropSets++; dropReps.push(reps); orderedSets.push({type:'drop', reps:reps}); }
                    else if (isFail) { failSets++; setsInPara++; setReps.push(reps); orderedSets.push({type:'normal', reps:reps}); }
                    else { setsInPara++; setReps.push(reps); orderedSets.push({type:'normal', reps:reps}); }
                    }
                } else if (line.startsWith('노트:')) {
                    noteText = line.replace('노트:', '').trim();
                } else if (!foundName && isNaN(line[0]) && !line.includes("kg") && !line.startsWith("http")) {
                    foundName = line;
                }
            });
            if (foundName && (hasRecord || warmSets > 0)) exerciseList.push({ name: foundName, sets: setsInPara, drops: dropSets, fails: failSets, warms: warmSets, note: noteText, setReps: setReps, warmReps: warmReps, dropReps: dropReps, orderedSets });
        });
        // 쿨다운 감지: 마지막부터 역순으로 duration 운동 합산
        let cooldownMins = 0;
        for (let i = exerciseList.length - 1; i >= 0; i--) {
            const ex = exerciseList[i];
            const allSets = ex.orderedSets || [];
            const hasDuration = allSets.some(s => typeof s.reps === 'string' && s.reps.includes(':'));
            const hasWeight = allSets.some(s => typeof s.reps === 'number');
            if (hasDuration && !hasWeight) {
                // duration만 있는 운동 → 쿨다운
                allSets.forEach(s => {
                    if (typeof s.reps === 'string' && s.reps.includes(':')) {
                        const parts = s.reps.split(':');
                        cooldownMins += parseInt(parts[0]);
                    }
                });
            } else {
                break; // 세트/무게 운동 나오면 중단
            }
        }





        return { workoutTitle, dateTime, fileDate, minutes, totalSets, exerciseList, cooldownMins };
    }

    async function rebuildLogTxt(currentData) {
        if (!checkToken()) return;

        const lines = [];

        const sortedDates =
            Object.keys(currentData).sort();

        for (const dateStr of sortedDates) {

            const item =
                currentData[dateStr];

            const strong =
                item.strong || 0;

            const cardio =
                (item.cooldown || 0) +
                (item.swim || 0) +
                (item.run || 0);

            const formattedDate =
                dateStr.replace(
                    /(\d{4})(\d{2})(\d{2})/,
                    '$1-$2-$3'
                );

            lines.push(
                `${formattedDate},${strong},${cardio}`
            );
        }

        const content =
            lines.join('\n') + '\n';

        const encoded =
            btoa(unescape(
                encodeURIComponent(content)
            ));

        const url =
            `https://api.github.com/repos/${GITHUB_REPO}/contents/log.txt`;

        let sha = "";

        try {
            const res = await fetch(url, {
                headers: {
                    Authorization:
                        `Bearer ${GITHUB_TOKEN}`
                }
            });

            if (res.ok) {
                const json =
                    await res.json();

                sha = json.sha;
            }
        } catch (e) {
            console.log(
                "log.txt sha load fail",
                e
            );
        }

        const putRes =
            await fetch(url, {
                method: "PUT",
                headers: {
                    Authorization:
                        `Bearer ${GITHUB_TOKEN}`,
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    message:
                        "Rebuild log.txt",
                    content: encoded,
                    sha
                })
            });

        if (!putRes.ok) {
            const err =
                await putRes.json();

            console.error(
                "log.txt rebuild fail",
                err
            );
        }
    }

    // ─── TYPE A (기존 오리지널) ───────────────────────────────────────────────
    function drawTypeA(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350; 
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const cardH = canvas.height * 0.55;
        const grad = ctx.createLinearGradient(0, canvas.height - cardH, 0, canvas.height);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.3, "rgba(0,0,0,0.5)");
        grad.addColorStop(1, "rgba(0,0,0,0.8)"); 
        ctx.fillStyle = grad;
        ctx.fillRect(0, canvas.height - cardH, canvas.width, cardH);

        const margin = 70;
        const colW = (canvas.width - margin * 2) / 2 - 30;
        const rowHeight = 70;
        const bottomY = canvas.height - 180; 
        const half = Math.ceil(exerciseList.length / 2);

        exerciseList.forEach((ex, i) => {
            let isRightCol = i >= half;
            let rowIdx = isRightCol ? i - half : i;
            const totalRowsInCol = isRightCol ? (exerciseList.length - half) : half;
            let x = margin + (isRightCol ? colW + 60 : 0);
            let y = bottomY - (totalRowsInCol - 1 - rowIdx) * rowHeight;
            ctx.textAlign = "left"; ctx.fillStyle = "white"; ctx.font = "700 25px 'Inter'";
            let name = ex.name;
            if (ctx.measureText(name).width > colW - 150) {
                while (ctx.measureText(name + "..").width > colW - 200) { name = name.slice(0, -1); }
                name += "..";
            }
            ctx.fillText(name, x, y);
            ctx.textAlign = "right";
            ctx.font = "700 " + (ex.sets > 5 ? 22 : 28) + "px 'Inter'";
            // 워밍업(노란) + 일반(레드) + 드롭(파란) — 오른쪽부터 드롭,일반,워밍업 순
            const aWarms = ex.warms || 0;
            const aDrops = ex.drops || 0;
            const aWarm = "▶\uFE0E".repeat(aWarms);
            const aNorm = "▶\uFE0E".repeat(ex.sets);
            const aDrop = "▶\uFE0E".repeat(aDrops);
            const aDropW = ctx.measureText(aDrop).width;
            const aNormW = ctx.measureText(aNorm).width;

            // orderedSets 순서대로 오른쪽부터 역순으로 그리기
            const oSets = ex.orderedSets || [];
            let ox = x + colW;
            for (var oi = oSets.length - 1; oi >= 0; oi--) {
                const ot = oSets[oi];
                ctx.fillStyle = ot.type==='warm' ? '#F0B83B' : ot.type==='drop' ? '#784CD8' : '#ff4757';
                const oc = ctx.measureText('▶\uFE0E').width;
                ox -= oc;
                ctx.fillText('▶\uFE0E', ox, y);
            }

        });

        const summaryY = canvas.height - 180 - (Math.max(half, exerciseList.length - half) - 1) * rowHeight - 110; 
        ctx.textAlign = "center"; ctx.fillStyle = "#ccc"; ctx.font = "400 32px 'Inter'";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", canvas.width / 2, summaryY);
        ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(margin, summaryY + 45); ctx.lineTo(canvas.width - margin, summaryY + 45); ctx.stroke();
        ctx.textAlign = "center"; ctx.fillStyle = "#ff4757"; ctx.font = "700 95px 'Archivo Black'";
        ctx.fillText(workoutTitle.toUpperCase(), canvas.width / 2, canvas.height - 65);
                // 하단 서명
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width / 2, canvas.height - 15);
    }
    

    // ─── TYPE B ─────────────────────────────────────────────────────────────
    function drawTypeB(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const iX = 70;
        const rX = canvas.width - 70;

        // 상단 그라디언트: 더 진하게 — 위 검정75% → 투명
        const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
        topGrad.addColorStop(0,   "rgba(0,0,0,0.82)");
        topGrad.addColorStop(0.6, "rgba(0,0,0,0.4)");
        topGrad.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 420);

        // 하단 그라디언트: 목록 높이에 맞게
        const half = Math.ceil(exerciseList.length / 2);
        const hasNote = exerciseList.some(function(e){ return e.note; });
        const rowH = hasNote ? 62 : 52;  // 여백 타이트하게
        const listAreaH = half * rowH + 70;
        const botGradTop = canvas.height - listAreaH - 60;

        const botGrad = ctx.createLinearGradient(0, botGradTop, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.65)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, botGradTop, canvas.width, canvas.height - botGradTop);

        // ── 상단: 제목 (빨간색, 중앙정렬, 더 크게) ──
        ctx.fillStyle = "#ff4757";
        ctx.font = "700 140px 'Archivo Black'";
        ctx.textAlign = "center";
        ctx.fillText(workoutTitle.toUpperCase(), canvas.width / 2, 158);

        // 메타 (중앙정렬)
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "400 30px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", canvas.width / 2, 205);

        // 상단 구분선
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(iX, 226);
        ctx.lineTo(rX, 226);
        ctx.stroke();

        // ── 하단: 2단 운동 목록 — 하단에서 위로 쌓음 ──
        const colW = (canvas.width - iX * 2 - 40) / 2;
        const col2X = iX + colW + 40;

        // 목록 맨 아래 기준점: 서명 위 10px
        const signY = canvas.height - 18;
        const listBot = signY - 60;  // 서명과 목록 사이 한 칸

        exerciseList.forEach(function(ex, i) {
            const col = i >= half ? 1 : 0;
            const row = col === 0 ? i : i - half;
            const colRows = col === 0 ? half : exerciseList.length - half;
            const x  = col === 0 ? iX : col2X;
            const xR = col === 0 ? iX + colW : col2X + colW;

            // 아래에서 위로 배치
            const y = listBot - (colRows - 1 - row) * rowH;

            // 이름
            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.font = "700 34px 'Inter'";
            ctx.textAlign = "left";
            let name = ex.name;
            const maxW = colW - 155;
            if (ctx.measureText(name).width > maxW) {
                while (ctx.measureText(name + "..").width > maxW) name = name.slice(0, -1);
                name += "..";
            }
            ctx.fillText(name, x, y);

            // 노트
            if (ex.note) {
                ctx.fillStyle = "rgba(255,210,75,0.78)";
                ctx.font = "400 20px 'Inter'";
                ctx.fillText(ex.note, x, y + 22);
            }

            // ㅇ 세트 — 워밍업:노란, 일반:레드, 드롭:파란
            ctx.font = "700 " + (ex.sets > 5 ? 26 : 32) + "px 'Inter'";
            ctx.textAlign = "right";
            const bWarms = ex.warms || 0;
            const bDrops = ex.drops || 0;
            const bWarm = "❚".repeat(bWarms);
            const bDrop = "❚".repeat(bDrops);
            const bNorm = "❚".repeat(ex.sets);
            const bDropW = ctx.measureText(bDrop).width;
            const bNormW = ctx.measureText(bNorm).width;
            const oSets = ex.orderedSets || [];
            let ox = xR;
            for (var oi = oSets.length - 1; oi >= 0; oi--) {
                const ot = oSets[oi];
                ctx.fillStyle = ot.type==='warm' ? '#F0B83B' : ot.type==='drop' ? '#784CD8' : '#ff4757';
                const oc = ctx.measureText('❚').width;
                ox -= (oc+4); // 세트 사이 간격
                ctx.fillText('❚', ox, y);
            }
                        


        });

        // 하단 서명
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width / 2, signY);
    }

    // ─── TYPE C : 좌하단 카드 ──────────────────────────────────────────────
    function drawTypeC(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const ACCENT = "#ff4757";
        const pad = 36;        // 카드 내부 패딩
        const cardW = 460;     // 카드 너비
        const cardX = 40;      // 좌측 여백
        const cardBot = canvas.height - 40; // 하단 여백

        // 카드 높이 계산 (운동 목록 수에 따라)
        const hasNote = exerciseList.some(function(e){ return e.note; });
        const rowH = hasNote ? 80 : 68;
        const listH = exerciseList.length * rowH;
        const headerH = 260; // 타이틀+메타 영역
        const footerH = 40;
        const cardH = headerH + listH + footerH;
        const cardY = cardBot - cardH;

        // 카드 배경 (반투명 검정)
        ctx.fillStyle = "rgba(0,0,0,0.50)";
        roundRect(ctx, cardX, cardY, cardW, cardH, 16);
        ctx.fill();

        const iX = cardX + pad;
        const rX = cardX + cardW - pad;

        // ── 타이틀 ──
        ctx.fillStyle = ACCENT;
        ctx.textAlign = "left";
        let fs = 88;
        ctx.font = "700 " + fs + "px 'Archivo Black'";
        while (ctx.measureText(workoutTitle.toUpperCase()).width > rX - iX && fs > 44) {
            fs -= 4;
            ctx.font = "700 " + fs + "px 'Archivo Black'";
        }
        ctx.fillText(workoutTitle.toUpperCase(), iX, cardY + fs + 20);

        // ── 메타 ──
        const metaY = cardY + fs + 24;
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.font = "400 24px 'Inter'";
        ctx.fillText(dateTime, iX, metaY + 32);
        ctx.fillText("TOTAL " + totalSets + " SETS", iX, metaY + 62);
        ctx.fillText(duration, iX, metaY + 92);

        // 구분선
        const divY = metaY + 110;
        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(iX, divY);
        ctx.lineTo(rX, divY);
        ctx.stroke();

        // ── 운동 목록 ──
        const listStartY = divY + 30;

        exerciseList.forEach(function(ex, i) {
            const y = listStartY + i * rowH;

            // 이름 — 밝은 회색
            ctx.fillStyle = "rgba(220,220,220,0.92)";
            ctx.font = "700 26px 'Inter'";
            ctx.textAlign = "left";
            let name = ex.name;
            const maxW = rX - iX;
            if (ctx.measureText(name).width > maxW) {
                while (ctx.measureText(name + "..").width > maxW) name = name.slice(0, -1);
                name += "..";
            }
            ctx.fillText(name, iX, y);

            // 노트
            let blockY = y + 28;
            if (ex.note) {
                ctx.fillStyle = "rgba(255,210,75,0.78)";
                ctx.font = "400 18px 'Inter'";
                ctx.fillText(ex.note, iX, y + 24);
                blockY = y + 46;
            }

            // 세트 블록 — 워밍업:노란, 일반:레드, 드롭:파란
            const bW = 26, bH = 20, bGap = 6;
            const cWarms = ex.warms || 0;
            const cDrops = ex.drops || 0;
            const warmCount = Math.min(cWarms, 12);
            const normalCount = Math.min(ex.sets, 12 - warmCount);
            const dropCount = Math.min(cDrops, 12 - warmCount - normalCount);
            //let bx = iX;

            const oSets = ex.orderedSets || [];
            let bx = iX;
            oSets.slice(0, 12).forEach(function(os) {
                ctx.fillStyle = os.type==='warm' ? '#F0B83B' : os.type==='drop' ? '#784CD8' : ACCENT;
                ctx.fillRect(bx, blockY - bH, bW, bH);
                bx += bW + bGap;
            });
            if (oSets.length > 12) {

    // ─── TYPE D : 상단 타이틀 + 운동 태그 줄줄이 ─────────────────────────────
    // 상단: 그라디언트 위에 타이틀 크게 + 메타
    // 운동 종목을 태그처럼 가로로 줄줄이 (넘치면 다음 줄)
    // 중앙은 사진 뻥 뚫림
    function drawTypeD(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // 살짝 전체 어둡게
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const iX = 60;
        const rX = canvas.width - 60;

        // ── 상단 그라디언트 ──
        // 높이는 내용에 따라 동적으로 계산
        ctx.font = "700 118px 'Archivo Black'";
        let fs = 118;
        while (ctx.measureText(workoutTitle.toUpperCase()).width > rX - iX && fs > 60) {
            fs -= 4;
            ctx.font = "700 " + fs + "px 'Archivo Black'";
        }

        // 태그 줄 계산 — 중앙정렬을 위해 줄별 너비 미리 계산
        const tagFont = "700 28px 'Inter'";
        ctx.font = tagFont;
        const tagPadX = 28, tagGap = 14;
        const tagLineH = 70;

        // 줄별 태그 그룹화
        const tagRows = [];
        let curRow = [], curRowW = 0;
        exerciseList.forEach(function(ex) {
            const tw = ctx.measureText(ex.name).width + tagPadX * 2;
            if (curRow.length > 0 && curRowW + tw + tagGap > canvas.width - iX * 2) {
                tagRows.push({ tags: curRow, width: curRowW - tagGap });
                curRow = []; curRowW = 0;
            }
            curRow.push({ ex: ex, tw: tw });
            curRowW += tw + tagGap;
        });
        if (curRow.length > 0) tagRows.push({ tags: curRow, width: curRowW - tagGap });

        const tagLines = tagRows.length;
        const headerH = fs + 30 + 50 + 20 + tagLines * tagLineH + 40;
        const topGrad = ctx.createLinearGradient(0, 0, 0, headerH);
        topGrad.addColorStop(0,   "rgba(0,0,0,0.80)");
        topGrad.addColorStop(0.7, "rgba(0,0,0,0.50)");
        topGrad.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, headerH);

        // ── 타이틀 ──
        ctx.fillStyle = "rgba(255,255,255,0.97)";
        ctx.font = "700 " + fs + "px 'Archivo Black'";
        ctx.textAlign = "left";
        ctx.fillText(workoutTitle.toUpperCase(), iX, fs + 20);

        // ── 메타 ──
        ctx.fillStyle = "rgba(255,255,255,0.48)";
        ctx.font = "400 30px 'Inter'";
        ctx.textAlign = "left";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", iX, fs + 72);

        // ── 태그 줄별 좌측정렬 ──
        let ty = fs + 72 + 36;
        ctx.font = tagFont;

        tagRows.forEach(function(row) {
            let tx = iX;

        row.tags.forEach(function(item) {
            const ex = item.ex;
            const tw = item.tw;

            // 태그 구조: tagTop=ty, 텍스트=ty+30, 블록=ty+44, 태그높이=58
            const TAG_H = 58;
            const textX = tx + tagPadX;

            // 태그 배경
            ctx.fillStyle = "rgba(255,255,255,0.12)";
            roundRect(ctx, tx, ty, tw, TAG_H, 8);
            ctx.fill();

            // 텍스트 (태그 상단에서 30px 아래)
            ctx.textAlign = "left";
            ctx.font = tagFont;
            let charX = textX;
            for (let c = 0; c < ex.name.length; c++) {
                const ch = ex.name[c];
                ctx.fillStyle = /[^a-zA-Z ]/.test(ch) ? "#ff4757" : "rgba(255,255,255,0.88)";
                ctx.fillText(ch, charX, ty + 30);
                charX += ctx.measureText(ch).width;
            }

            // 세트 블록 (텍스트 아래 딱 붙게 ty+42)
            const bW = 8, bH = 6, bGap = 3;
            const warms = ex.warms || 0, drops = ex.drops || 0;
            const oSets = ex.orderedSets || [];
            let bx = textX;
            oSets.slice(0, 6).forEach(function(os) {
                ctx.fillStyle = os.type==='warm' ? '#F0B83B' : os.type==='drop' ? '#784CD8' : '#ff4757';
                ctx.fillRect(bx, ty + 42, bW, bH);
                bx += bW + bGap;
            });
            //let bx = textX;
            //ctx.fillStyle = "#F0B83B";
            //for (let s = 0; s < Math.min(warms, 6); s++) ctx.fillRect(bx + s*(bW+bGap), ty + 42, bW, bH);
            //bx += Math.min(warms, 6) * (bW + bGap);
            //ctx.fillStyle = "#ff4757";
            //for (let s = 0; s < Math.min(ex.sets, 6); s++) ctx.fillRect(bx + s*(bW+bGap), ty + 42, bW, bH);
           // bx += Math.min(ex.sets, 6) * (bW + bGap);
            //ctx.fillStyle = "#784CD8";
           // for (let s = 0; s < Math.min(drops, 6); s++) ctx.fillRect(bx + s*(bW+bGap), ty + 42, bW, bH);

           tx += tw + tagGap;
        }); // row.tags.forEach
        ty += tagLineH;
        }); // tagRows.forEach

        // 하단 서명
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width / 2, canvas.height - 25);
    }

    
    // ─── TYPE E : 플릭 스타일 ────────────────────────────────────────────────
    function drawTypeE(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
 
        const iX = 70;
        const rX = canvas.width - 70;
        const headEnd = 240;   // 헤드 끝 Y
        const signY = canvas.height - 22;
        const availH = canvas.height - headEnd - 50; // 목록에 쓸 수 있는 높이
 
        // ── 원 크기 자동 결정 ──
        // 기본 크기로 계산해보고 안 들어오면 줄임
        function calcLayout(R) {
            const gap = Math.round(R * 0.38);
            const exGap = Math.round(R * 0.2);
            const exFont = Math.max(20, Math.round(R * 0.88));
            const maxPR = Math.floor((canvas.width - iX * 2 + gap) / (R * 2 + gap));
            const heights = exerciseList.map(function(ex) {
                const total = (ex.warms || 0) + ex.sets + (ex.drops || 0);
                const lines = Math.max(1, Math.ceil(total / maxPR));
                return exFont + 8 + lines * (R * 2 + 8) + exGap;
            });
            const total = heights.reduce(function(s,h){ return s+h; }, 0);
            return { R, gap, exGap, exFont, maxPR, heights, totalH: total };
        }
 
        let L = calcLayout(36);
        if (L.totalH > availH) L = calcLayout(30);
        if (L.totalH > availH) L = calcLayout(25);
        if (L.totalH > availH) L = calcLayout(20);
 
        const { R, gap, exGap, exFont, maxPR, heights } = L;
        const repsFont = Math.max(14, Math.round(R * 0.72));
 
        // 상단 그라디언트
        const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
        topGrad.addColorStop(0,   "rgba(0,0,0,0.82)");
        topGrad.addColorStop(0.6, "rgba(0,0,0,0.4)");
        topGrad.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 420);
 
        // 타이틀
        ctx.fillStyle = "#ff4757";
        ctx.font = "700 140px 'Archivo Black'";
        ctx.textAlign = "center";
        ctx.fillText(workoutTitle.toUpperCase(), canvas.width / 2, 158);
 
        // 메타
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "400 30px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", canvas.width / 2, 205);
 
        // 구분선
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(iX, 226); ctx.lineTo(rX, 226); ctx.stroke();
 
        // 하단 그라디언트 (목록 시작 위부터)
        const totalListH = L.totalH;
        const listStartY = canvas.height - 50 - totalListH;
        const gradStart = Math.max(headEnd, listStartY - 80);
        const botGrad = ctx.createLinearGradient(0, gradStart, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.72)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, gradStart, canvas.width, canvas.height - gradStart);
 
        // 운동 목록 — 하단에서 위로 쌓기
        let curY = canvas.height - 40 - totalListH;
        // 헤드와 겹치면 헤드 바로 아래부터 시작
        if (curY < headEnd) curY = headEnd;
 
        exerciseList.forEach(function(ex, i) {
            const ex_y = curY;
 
            // 운동명
            ctx.fillStyle = "rgba(255,255,255,0.92)";
            ctx.font = "700 " + exFont + "px 'Inter'";
            ctx.textAlign = "left";
            let name = ex.name;
            const maxNameW = rX - iX;
            if (ctx.measureText(name).width > maxNameW) {
                while (ctx.measureText(name + "..").width > maxNameW) name = name.slice(0,-1);
                name += "..";
            }
            ctx.fillText(name, iX, ex_y + exFont);
 
            // 세트 배열 구성 — reps 데이터 활용
            const wReps = ex.warmReps || [];
            const sReps = ex.setReps  || [];
            const dReps = ex.dropReps || [];

           const allSets = ex.orderedSets && ex.orderedSets.length
                ? ex.orderedSets
                : [];
            // orderedSets 없으면 기존 방식으로 fallback
            if (!allSets.length) {
                for (var w=0; w<(ex.warms||0); w++) allSets.push({type:'warm',  reps: wReps[w]||0});
                for (var s=0; s<ex.sets;       s++) allSets.push({type:'normal', reps: sReps[s]||0});
                for (var d=0; d<(ex.drops||0); d++) allSets.push({type:'drop',   reps: dReps[d]||0});
            }
 
            let cY = ex_y + exFont + 8;
            let cX = iX;
 
            allSets.forEach(function(s, si) {
                if (si > 0 && si % maxPR === 0) { cY += R*2+8; cX = iX; }
 
                const color = s.type==='warm' ? '#F0B83B' : s.type==='drop' ? '#784CD8' : '#ff4757';
                ctx.beginPath();
                ctx.arc(cX+R, cY+R, R, 0, Math.PI*2);
                ctx.fillStyle = color;
                ctx.fill();
 
                // 원 안 레이블: reps 있으면 숫자, 없으면 W/D/세트번호
                let label;
                if (typeof s.reps === 'string' && s.reps.includes(':')) {
                    label = s.reps; // 시간 표기
                } else if (s.reps > 0) {
                    label = String(s.reps);
                } else {
                    label = s.type==='warm' ? 'W' : s.type==='drop' ? 'D' :
                        String(allSets.slice(0,si+1).filter(function(t){return t.type==='normal';}).length);
                }
 
                const isTime = typeof label === 'string' && label.includes(':');
                const lFont = isTime ? Math.max(12, Math.round(repsFont*0.8)) : repsFont;
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.font = "700 " + lFont + "px 'Inter'";
                ctx.textAlign = "center";
                ctx.fillText(label, cX+R, cY+R + lFont*0.36);
 
                cX += R*2 + gap;
            });
 
            // 노트
            if (ex.note) {
                ctx.fillStyle = "rgba(255,210,75,0.78)";
                ctx.font = "400 " + Math.max(16,Math.round(exFont*0.65)) + "px 'Inter'";
                ctx.textAlign = "left";
                ctx.fillText(ex.note, iX, cY + R*2 + 20);
            }
 
            curY += heights[i];
        });
 
        // 서명
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width/2, signY);
    }
 

    // ─── TYPE F : 플릭2 ──────────────────────────────────────────────────────
    function drawTypeF(img, workoutTitle, dateTime, duration, totalSets, exerciseList) {
        canvas.width = 1080; canvas.height = 1350;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const iX = 40;
        const rX = canvas.width - 40;
        const headEnd = 240;
        const signY = canvas.height - 22;
        const availH = canvas.height - headEnd - 50;

        // 원 크기 자동 결정 (E와 동일)
        function calcLayout(R) {
            const gap = Math.round(R * 0.1);
            const exGap = Math.round(R * 0.5);
            const exFont = Math.max(20, Math.round(R * 1.2));
            const maxPR = Math.floor((canvas.width - iX * 2 + gap) / (R * 2 + gap));
            const half = Math.ceil(exerciseList.length / 2);
            const heights = exerciseList.map(function(ex) {
            const total = (ex.orderedSets || []).length || ((ex.warms||0) + ex.sets + (ex.drops||0));
            const lines = Math.max(1, Math.ceil(total / Math.floor(maxPR / 2)));
            return exFont + 8 + lines * (R * 1 + 2) + exGap;
});
const leftH  = heights.slice(0, half).reduce(function(s,h){ return s+h; }, 0);
const rightH = heights.slice(half).reduce(function(s,h){ return s+h; }, 0);
const total  = Math.max(leftH, rightH);
return { R, gap, exGap, exFont, maxPR: Math.floor(maxPR / 2), heights, totalH: total, half };


        }

        let L = calcLayout(25);
        if (L.totalH > availH) L = calcLayout(23);
        if (L.totalH > availH) L = calcLayout(21);
        if (L.totalH > availH) L = calcLayout(16);

        const { R, gap, exGap, exFont, maxPR, heights } = L;
        const half = L.half || Math.ceil(exerciseList.length / 2);
        const colW = Math.floor((canvas.width - iX * 2 - 40) / 2);
        const col2X = iX + colW + 40;

        const repsFont = Math.max(14, Math.round(R * 0.72));

        // 상단 그라디언트
        const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
        topGrad.addColorStop(0,   "rgba(0,0,0,0.82)");
        topGrad.addColorStop(0.6, "rgba(0,0,0,0.4)");
        topGrad.addColorStop(1,   "rgba(0,0,0,0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, canvas.width, 420);

        // 타이틀
        ctx.fillStyle = "#ff4757";
        ctx.font = "700 140px 'Archivo Black'";
        ctx.textAlign = "center";
        ctx.fillText(workoutTitle.toUpperCase(), canvas.width / 2, 158);

        // 메타
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "400 30px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText(dateTime + "  |  " + duration + "  |  TOTAL " + totalSets + " SETS", canvas.width / 2, 205);

        // 구분선
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(iX, 226); ctx.lineTo(rX, 226); ctx.stroke();

        // 하단 그라디언트
        const totalListH = L.totalH;
        const listStartY = canvas.height - 50 - totalListH;
        const gradStart = Math.max(headEnd, listStartY - 80);
        const botGrad = ctx.createLinearGradient(0, gradStart, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.72)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, gradStart, canvas.width, canvas.height - gradStart);

        // 운동 목록
        let curY = canvas.height - 50 - totalListH;
        if (curY < headEnd) curY = headEnd;



        // 수정 후 (120~150 정도로 키워보세요)
        const bottomMargin = 90; // 이 숫자를 키울수록 위로 올라갑니다.
        const leftStart  = canvas.height - bottomMargin - heights.slice(0, half).reduce(function(s,h){return s+h;},0);
        const rightStart = canvas.height - bottomMargin - heights.slice(half).reduce(function(s,h){return s+h;},0);

        exerciseList.forEach(function(ex, i) {
            const isRight = i >= half;
            const col = isRight ? 1 : 0;
            const row = isRight ? i - half : i;
            const startX = col === 0 ? iX : col2X;
            const endX   = col === 0 ? iX + colW : col2X + colW;

            // 이 운동의 Y 시작점
            const colHeights = isRight ? heights.slice(half) : heights.slice(0, half);
            const rowOffset  = colHeights.slice(0, row).reduce(function(s,h){return s+h;},0);
            const ex_y = (isRight ? rightStart : leftStart) + rowOffset;

            const wReps = ex.warmReps || [];
            const sReps = ex.setReps  || [];
            const dReps = ex.dropReps || [];
            const allSets = ex.orderedSets && ex.orderedSets.length
                ? ex.orderedSets
                : (function() {
                    var arr = [];
                    for (var w=0; w<(ex.warms||0); w++) arr.push({type:'warm',  reps: wReps[w]||0});
                    for (var s=0; s<ex.sets;       s++) arr.push({type:'normal', reps: sReps[s]||0});
                    for (var d=0; d<(ex.drops||0); d++) arr.push({type:'drop',   reps: dReps[d]||0});
                    return arr;
                })();

            const lines = Math.max(1, Math.ceil(allSets.length / maxPR));

            for (var line = 0; line < lines; line++) {
                const linesets = allSets.slice(line * maxPR, (line + 1) * maxPR);
                const cY = ex_y + exFont + 8 + line * (R * 1+2);

                // 운동명 — 첫 줄 좌측
                if (line === 0) {
                    ctx.fillStyle = "rgba(255,255,255,0.92)";
                    ctx.font = "700 " + exFont + "px 'Inter'";
                    ctx.textAlign = "left";
                    let name = ex.name;
                    const circlesW = linesets.length * (R * 1.4 + gap) - gap;
                    const nameMaxW = Math.max(60, colW - circlesW - 20);
                    if (ctx.measureText(name).width > nameMaxW) {
                        while (name.length > 1 && ctx.measureText(name + "..").width > nameMaxW) name = name.slice(0,-1);
                        name += "..";
                    }
                    ctx.fillText(name, startX, cY + R + exFont * 0.36);
                }

                // 원들 — 우측정렬
                const circlesW = linesets.length * (R * 1.4 + gap) - gap;
                let cX = endX - circlesW;

                linesets.forEach(function(s, si) {
                    const color = s.type==='warm' ? '#F0B83B' : s.type==='drop' ? '#784CD8' : '#ff4757';
                    // --- 여기부터 수정 시작 ---
                     const rectW = R * 1.4; // 가로 길이를 반지름의 2.4배로 (원래 2)
                    const rectH = R * 2; // 세로 길이를 반지름의 1.8배로 (원래 2)
                    const cornerRadius = 8; // 둥근 모서리 반경

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    // cX, cY는 이미 계산되어 있으므로 그대로 사용하되, 둥근 사각형 그리기
                    ctx.roundRect(cX, cY + (R - rectH/2), rectW, rectH, cornerRadius);
                    ctx.fill();
                    // --- 수정 끝 ---

                    let label;
                    const globalIdx = line * maxPR + si;
                    if (typeof s.reps === 'string' && s.reps.includes(':')) {
                        label = s.reps;
                    } else if (s.reps > 0) {
                        label = String(s.reps);
                    } else {
                        label = s.type==='warm' ? 'W' : s.type==='drop' ? 'D' :
                            String(allSets.slice(0, globalIdx+1).filter(function(t){return t.type==='normal';}).length);
                    }

                    const isTime = typeof label === 'string' && label.includes(':');
                  
                    const lFont = isTime ? Math.round(repsFont * 0.8) : Math.round(repsFont * 1.2);

            if (scores[part] > 0) {
                var labelWidth = ctx.measureText(abbr).width;
                var numX = p[0];
                if (align === 'left') numX = p[0] + labelWidth / 2;
                else if (align === 'right') numX = p[0] - labelWidth / 2;
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffaaaa";
                ctx.font = "400 17px 'Inter'";
                ctx.fillText(scores[part] % 1 === 0 ? scores[part] : scores[part].toFixed(1), numX, p[1] + 22);
            }
            ctx.restore();
        });

        // 하단 운동 태그 (가운데 정렬)
        var tagFont = "700 22px 'Inter'";
        ctx.font = tagFont;
        var tagPadX = 20, tagGap = 10, tagH = 46, tagLineH = 56;
        var tagMaxW = canvas.width - iX * 2;

        var tagRows = [], curRow = [], curRowW = 0;
        exerciseList.forEach(function(ex) {
            var tw = ctx.measureText(ex.name).width + tagPadX * 2;
            if (curRow.length > 0 && curRowW + tw + tagGap > tagMaxW) {
                tagRows.push({ tags: curRow, w: curRowW - tagGap });
                curRow = []; curRowW = 0;
            }
            curRow.push({ ex: ex, tw: tw });
            curRowW += tw + tagGap;
        });
        if (curRow.length > 0) tagRows.push({ tags: curRow, w: curRowW - tagGap });

        var tagTotalH = tagRows.length * tagLineH;
        var tagY = canvas.height - 55 - tagTotalH;

        // 하단 그라디언트
        var botGrad = ctx.createLinearGradient(0, tagY - 60, 0, canvas.height);
        botGrad.addColorStop(0, "rgba(0,0,0,0)");
        botGrad.addColorStop(1, "rgba(0,0,0,0.65)");
        ctx.fillStyle = botGrad;
        ctx.fillRect(0, tagY - 60, canvas.width, canvas.height - (tagY - 60));

        tagRows.forEach(function(row) {
            var tx = Math.round((canvas.width - row.w) / 2); // 가운데 정렬
            row.tags.forEach(function(item) {
                var ex = item.ex;
                var tw = item.tw;
                var textX = tx + tagPadX;

                ctx.fillStyle = "rgba(255,255,255,0.10)";
                roundRect(ctx, tx, tagY, tw, tagH, 7);
                ctx.fill();

                ctx.font = tagFont;
                ctx.textAlign = "left";
                var charX = textX;
                for (var ci = 0; ci < ex.name.length; ci++) {
                    var ch = ex.name[ci];
                    ctx.fillStyle = /[^a-zA-Z ]/.test(ch) ? "#ff4757" : "rgba(255,255,255,0.85)";
                    ctx.fillText(ch, charX, tagY + 30);
                    charX += ctx.measureText(ch).width;
                }

                var bW = 7, bH = 5, bGap = 3;
                var oSets = ex.orderedSets || [];
                var bx = textX;
                oSets.slice(0, 6).forEach(function(os) {
                    ctx.fillStyle = os.type==='warm' ? '#F0B83B' : os.type==='drop' ? '#784CD8' : '#ff4757';
                    ctx.fillRect(bx, tagY + 38, bW, bH);
                    bx += bW + bGap;
                });

                tx += tw + tagGap;
            });
            tagY += tagLineH;
        });

        // 서명
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.font = "400 22px 'Inter'";
        ctx.textAlign = "center";
        ctx.fillText("SHARE STRONG IMAGE V2", canvas.width / 2, canvas.height - 22);
    }
}

    // ─── 유틸: 둥근 사각형 ───────────────────────────────────────────────────
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    (function(){
        const params = new URLSearchParams(location.search);
        const data = params.get("log");
        if(data){
            document.getElementById("logInput").value = decodeURIComponent(data);
            setTimeout(()=>{ document.getElementById("imageInput").click(); }, 500);
        }
    })();
</script>
