name: Daily image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *" # 한국시간 매일 00:00
  push:
    branches: [main]
    paths:
      - log.txt
      - ppl/**
      - assets/**
      - scripts/make-image.mjs

permissions:
  contents: write

concurrency:
  group: daily-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core
      - name: Make image
        run: node scripts/make-image.mjs
      - name: Publish to image branch (history is reset every time)
        run: |
          cd site
          git init -q -b image
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add today.jpg
          git commit -qm "daily image"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin image
