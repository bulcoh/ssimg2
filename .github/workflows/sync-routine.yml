name: Sync routine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert routine 1
        env:
          CSV_URL: ${{ secrets.CSV_URL_1 }}
          OUT_FILE: ppl/routine1+531(json).json
        run: node scripts/convert.mjs
      - name: Convert routine 2
        env:
          CSV_URL: ${{ secrets.CSV_URL_2 }}
          OUT_FILE: ppl/routine2+531(json).json
        run: node scripts/convert.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain ppl)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add ppl
            git commit -m "sync routines from sheet"
            git push
          else
            echo "변경 없음"
          fi
