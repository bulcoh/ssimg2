<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동 로그</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg: #000000;
    --surface: #31313b;
    --border: #329EA1;
    --text: #E4C2A6;
    --text-dim: #329EA1;
    --bar: #329EA1;
    --sat-text: #4a9eff;
    --sun-text: #d15454;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 20px 14px 40px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
  }

  .date-now {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 300;
  }

  .dow-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }

  .dow-header div {
    text-align: center;
    font-size: 11px;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .dow-header div:first-child { color: var(--sun-text); }
  .dow-header div:last-child  { color: var(--sat-text); }

  .week-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin: 12px 0 5px;
    padding-left: 2px;
  }

  .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }

  .day-cell {
    position: relative;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    height: 80px;
  }

.day-cell.today {
  outline: 3px solid rgb(50, 168, 151);
  outline-offset: -3px;
  background: #1e1e24;
}

  /* 그리드선 — 셀 전체 기준, 10분 간격 */
  .grid-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .grid-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.10);
  }

  /* 날짜 숫자 — 바 위에 오버레이 */
  .day-num {
    position: absolute;
    top: 5px;
    left: 5px;
    font-size: 10px;
    font-weight: 400;
    z-index: 4;
    line-height: 1;
    color: var(--text-dim);
  }

  .day-cell.today .day-num { color: #fff; font-weight: 500; }
  .day-cell.sat   .day-num { color: var(--sat-text); }
  .day-cell.sun   .day-num { color: var(--sun-text); }

  .month-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: 8px;
    color: var(--text-dim);
    opacity: 0.6;
    z-index: 5;
  }

  /* 바: 아래서 위로, 셀 전체 높이 기준 */
  .bar-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bar);
    z-index: 2;
  }

  .day-cell.today .bar-fill { background: #ff6b5b; }

  /* min — 바 상단 중앙 */
  .bar-min {
    position: absolute;
    top: 5px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.9);
    font-weight: 500;
    line-height: 1;
    z-index: 3;
  }

  /* title — 바 하단 중앙 */
  .bar-title {
    position: absolute;
    bottom: 4px;
    left: 2px; right: 2px;
    text-align: center;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 3;
  }

  .today-dot {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    z-index: 6;
  }

  .error {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    margin-top: 60px;
  }
</style>
</head>
<body>

<header>
  <div class="title">Workout Calendar</div>
  <div class="date-now" id="dateNow"></div>
</header>

<div class="dow-header">
  <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>

<div id="app"></div>

<script>
const JSON_URL  = 'https://raw.githubusercontent.com/bulcoh/ssimg2/refs/heads/main/data.json';
const MAX_MIN   = 110;
const CELL_H    = 80;
const WDS_KO    = ['일','월','화','수','목','금','토'];
const MONTHS_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function formatKey(d) {
  return d.getFullYear()
    + ('0'+(d.getMonth()+1)).slice(-2)
    + ('0'+d.getDate()).slice(-2);
}

const now = new Date();
document.getElementById('dateNow').textContent =
  now.getFullYear() + '.' + ('0'+(now.getMonth()+1)).slice(-2) + '.' + ('0'+now.getDate()).slice(-2)
  + ' ' + WDS_KO[now.getDay()];

// 10분 간격 그리드선: 셀 전체 높이(80px) 기준
function gridLines() {
  let html = '<div class="grid-lines">';
  for (let m = 10; m < MAX_MIN; m += 10) {
    const bottom = Math.round(m / MAX_MIN * CELL_H);
    html += `<div class="grid-line" style="bottom:${bottom}px"></div>`;
  }
  html += '</div>';
  return html;
}

function getWeeks() {
  const today = new Date(now);
  today.setHours(0,0,0,0);
  const startSun = new Date(today);
  startSun.setDate(today.getDate() - today.getDay());
  const firstSun = new Date(startSun);
  firstSun.setDate(startSun.getDate() - 21);
  const weeks = [];
  let cursor = new Date(firstSun);
  for (let w = 0; w < 4; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      week.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
  }
  return weeks;
}

function weekLabel(week) {
  const first = week[0];
  const last  = week[6];
  if (first.getMonth() !== last.getMonth()) {
    return MONTHS_KO[first.getMonth()] + ' / ' + MONTHS_KO[last.getMonth()];
  }
  const weekNum = Math.ceil(last.getDate() / 7);
  return MONTHS_KO[first.getMonth()] + ' ' + weekNum + '째주';
}

fetch(JSON_URL)
  .then(r => r.json())
  .then(data => {
    const app = document.getElementById('app');
    const weeks = getWeeks();
    const todayKey = formatKey(now);
    let html = '';

    weeks.forEach(week => {
      html += `<div class="week-label">${weekLabel(week)}</div>`;
      html += `<div class="week-row">`;

      week.forEach(d => {
        const key     = formatKey(d);
        const entry   = data[key];
        const min     = entry && entry.strong ? entry.strong : 0;
        const title   = entry && entry.workout && entry.workout.title ? entry.workout.title : '';
        const isToday = key === todayKey;
        const dow     = d.getDay();

        let cls = 'day-cell';
        if (isToday)    cls += ' today';
        else if (dow===6) cls += ' sat';
        else if (dow===0) cls += ' sun';

        // 바 높이: 셀 전체(80px) 기준
        const barH = min > 0 ? Math.min(Math.round(min / MAX_MIN * CELL_H), CELL_H) : 0;

        const monthBadge = d.getDate() === 1
          ? `<div class="month-badge">${MONTHS_KO[d.getMonth()]}</div>` : '';

        let barHTML = '';
        if (barH > 0) {
          barHTML = `<div class="bar-fill" style="height:${barH}px">
            <span class="bar-min">${min}min</span>
            ${title ? `<span class="bar-title">${title}</span>` : ''}
          </div>`;
        }

        html += `<div class="${cls}">
          ${gridLines()}
          <div class="day-num">${d.getDate()}</div>
          ${monthBadge}
          ${barHTML}
          ${isToday ? `<div class="today-dot"></div>` : ''}
        </div>`;
      });

      html += `</div>`;
    });

    app.innerHTML = html;
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="error">데이터를 불러오지 못했어요<br><small>${err}</small></div>`;
  });
</script>
</body>
</html>
